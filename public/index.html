<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallmanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* ============================================================
   FORMATTING — colors, fonts, sizes. Edit here, not in the JS.
   ============================================================ */
:root{
  --ink:        #12181B;
  --panel:      #1B2327;
  --panel-line: #2A3439;
  --text:       #EDEAE2;
  --text-dim:   #8C979B;
  --today-ring: #5FA8A0;

  --font-display: 'Fraunces', serif;
  --font-body:    'IBM Plex Sans', sans-serif;
  --font-mono:    'IBM Plex Mono', monospace;

  --grid-gap: 6px;
  --radius: 10px;
  --week-strip-height: 120px; /* overridden from config on load */
}
</style>
</head>
<body>

<div id="app">
  <main id="content">
    <section id="month-grid-wrap">
      <div id="weekday-row"></div>
      <div id="month-grid"></div>
    </section>
    <aside id="side-col">
      <div id="agenda-wrap">
        <div id="agenda-header">
          <div id="agenda-title">Up next</div>
          <div id="clock-wrap">
            <div id="clock"></div>
            <div id="today-date"></div>
          </div>
          <a href="/config.html" id="config-link" title="Settings">⚙</a>
        </div>
        <div id="agenda-list"></div>
      </div>
      <div id="todo-wrap">
        <div id="todo-title">To-do</div>
        <div id="todo-list"></div>
      </div>
    </aside>
  </main>

  <div id="status"></div>
</div>

<script>
let SETTINGS = { weekStartsOn: 0, use24HourClock: false, agendaDaysAhead: 14, maxEventsPerDayCell: 2, todosEnabled: false, todoTitle: 'To-do' };
let allEvents = []; // parsed from /api/events, dates as Date objects

function pad(n){ return n.toString().padStart(2,'0'); }
// Event/task titles come from third-party calendar feeds — never trust them raw
// in innerHTML.
function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
const _contrastCanvas = document.createElement('canvas');
_contrastCanvas.width = _contrastCanvas.height = 1;
const _contrastCtx = _contrastCanvas.getContext('2d');
function contrastColor(color){
  _contrastCtx.clearRect(0,0,1,1);
  _contrastCtx.fillStyle = color;
  _contrastCtx.fillRect(0,0,1,1);
  const [r,g,b] = _contrastCtx.getImageData(0,0,1,1).data;
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.6 ? '#12181B' : '#FFFFFF';
}
const DEFAULT_ICON = 'fa-solid fa-house';
function renderIcon(symbol){
  const s = (symbol || '').trim();
  if(!s) return `<i class="${DEFAULT_ICON}"></i>`;
  // Treat any string containing an "fa-" token as Font Awesome classes.
  if(/(^|\s)fa-/.test(s)) return `<i class="${s.includes('fa-solid')||s.includes('fa-regular')||s.includes('fa-brands')||s.includes('fa-light')?'':'fa-solid '}${s}"></i>`;
  return s; // literal text / emoji fallback for backwards compat
}
// All-day events arrive anchored to UTC midnight of the date they name (see
// toUtcMidnight in calendars.js), so read them back with the UTC getters and
// rebuild them at local midnight — otherwise they'd render a day early for any
// viewer behind UTC. Timed events are real instants and parse normally.
function parseEventDate(value, allDay){
  const d = new Date(value);
  if(!allDay) return d;
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

const WEEKDAY_LABELS_SUN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderClock(){
  const now = new Date();
  let h = now.getHours();
  let suffix = '';
  if(!SETTINGS.use24HourClock){
    suffix = h >= 12 ? ' PM' : ' AM';
    h = h % 12; if(h===0) h = 12;
  }
  document.getElementById('clock').textContent = `${h}:${pad(now.getMinutes())}${suffix}`;
  document.getElementById('today-date').textContent = now.toLocaleDateString(undefined,{ weekday:'long', month:'long', day:'numeric' });
}


function renderWeekdayRow(){
  const labels = [...WEEKDAY_LABELS_SUN.slice(SETTINGS.weekStartsOn), ...WEEKDAY_LABELS_SUN.slice(0,SETTINGS.weekStartsOn)];
  document.getElementById('weekday-row').innerHTML = labels.map(l => `<div class="weekday">${l}</div>`).join('');
}

function eventsOnDay(day){
  return allEvents.filter(e => sameDay(e.start, day) || (e.allDay && e.start <= day && day < e.end))
                   .sort((a,b)=>a.start-b.start);
}

// Trim chips that don't fit the cell's fixed height and account for them in a
// "+N more" line. The grid is a fixed-size wall display, so cells never grow —
// anything that doesn't fit has to be summarised instead of overflowing.
function fitDayCell(box){
  const total = parseInt(box.dataset.total, 10) || 0;
  const chips = [...box.querySelectorAll('.event-chip')];
  const overflows = () => box.scrollHeight > box.clientHeight + 1;
  let more = null;

  function setMore(n){
    if(n <= 0){ if(more){ more.remove(); more = null; } return; }
    if(!more){ more = document.createElement('div'); more.className = 'more-chip'; }
    more.textContent = `+${n} more`;
    box.appendChild(more); // always the last line in the cell
  }

  // Put every chip back, then drop them from the bottom until what's left —
  // including the "+N more" line, which costs height of its own — fits.
  function fit(){
    if(more){ more.remove(); more = null; }
    chips.forEach(c => box.appendChild(c));
    let shown = chips.length;
    setMore(total - shown);
    while(shown > 0 && overflows()){
      chips[--shown].remove();
      setMore(total - shown);
    }
    return shown;
  }

  const shown = fit();
  // Still hiding events? Trade two-line titles for single-line ellipsised ones:
  // roughly twice as many chips then fit, which is what a busy day needs on a
  // smaller display. Revert if it didn't actually buy a row.
  if(shown < total){
    box.classList.add('compact');
    if(fit() <= shown){ box.classList.remove('compact'); fit(); }
  }
}

function renderMonthGrid(){
  const now = new Date();
  const today = startOfDay(now);
  const currentMonth = now.getMonth();
  const leading = (today.getDay() - SETTINGS.weekStartsOn + 7) % 7;
  const gridStart = addDays(today, -leading);
  const rows = 5;
  const totalCells = rows * 7;

  const grid = document.getElementById('month-grid');
  grid.innerHTML = '';
  // minmax(0, 1fr), not 1fr: a bare 1fr track is min-content-sized at the
  // bottom, so a busy day would stretch its row and push the weeks below it
  // off the display. minmax(0, ...) pins every week to an equal share.
  grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;

  const boxes = [];
  for(let i=0;i<totalCells;i++){
    const day = addDays(gridStart, i);
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if(day.getMonth() !== currentMonth) cell.classList.add('outside');
    if(sameDay(day, today)) cell.classList.add('is-today');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = day.getDate();
    cell.appendChild(num);

    const box = document.createElement('div');
    box.className = 'day-events';
    cell.appendChild(box);

    const evs = eventsOnDay(day);
    // maxEventsPerDayCell is an optional hard cap; 0 / unset means "as many as
    // physically fit". Either way fitDayCell() has the final say.
    const cap = SETTINGS.maxEventsPerDayCell > 0 ? SETTINGS.maxEventsPerDayCell : evs.length;
    const shown = evs.slice(0, cap);
    shown.forEach(e=>{
      const chip = document.createElement('div');
      chip.className = 'event-chip';
      chip.style.background = e.color;
      chip.style.color = contrastColor(e.color);
      const time = e.allDay ? '' : e.start.toLocaleTimeString(undefined,{ hour:'numeric', minute:'2-digit', hour12: !SETTINGS.use24HourClock });
      chip.innerHTML = `<span class="chip-symbol">${renderIcon(e.symbol)}</span>`
        + `<span class="chip-title">`
        + (time ? `<span class="chip-time">${time}</span> ` : '')
        + `${escapeHtml(e.title)}</span>`;
      box.appendChild(chip);
    });
    box.dataset.total = evs.length;
    if(evs.length) boxes.push(box);
    grid.appendChild(cell);
  }

  // One pass after the whole grid is in the DOM, so the measuring below reads a
  // single settled layout rather than reflowing cell by cell.
  boxes.forEach(fitDayCell);
}

function renderAgenda(){
  const list = document.getElementById('agenda-list');
  list.innerHTML = '';
  const today = startOfDay(new Date());
  const end = addDays(today, SETTINGS.agendaDaysAhead);

  const upcoming = allEvents
    .filter(e => e.start < end && e.end >= today)
    .sort((a,b)=>a.start-b.start);

  if(upcoming.length === 0){
    list.innerHTML = `<div class="agenda-empty">Nothing on the calendar for the next ${SETTINGS.agendaDaysAhead} days.</div>`;
    return;
  }

  upcoming.forEach(e=>{
    const dayLabel = sameDay(e.start, today) ? 'Today'
      : sameDay(e.start, addDays(today,1)) ? 'Tomorrow'
      : e.start.toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
    const timeStr = e.allDay ? 'All day' : e.start.toLocaleTimeString(undefined,{ hour:'numeric', minute:'2-digit', hour12: !SETTINGS.use24HourClock });

    const row = document.createElement('div');
    row.className = 'agenda-row';
    row.style.background = e.color;
    row.style.color = contrastColor(e.color);
    const symbolStr = `<span class="agenda-symbol">${renderIcon(e.symbol)}</span>`;
    row.innerHTML = `${symbolStr}
                      <span class="agenda-name">${escapeHtml(e.title)}</span>
                      <span class="agenda-when">
                        <span class="agenda-when-day">${dayLabel}</span>
                        <span class="agenda-when-time">${timeStr}</span>
                      </span>`;
    list.appendChild(row);
  });
}

function renderTodos(data){
  const wrap = document.getElementById('todo-wrap');
  const list = document.getElementById('todo-list');
  document.getElementById('todo-title').textContent = SETTINGS.todoTitle || 'To-do';

  if(!SETTINGS.todosEnabled){
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = '';

  if(!data.connected){
    list.innerHTML = `<div class="todo-empty">Not connected. Visit <span class="todo-mono">/auth/google</span> from a browser to connect Google Tasks.</div>`;
    return;
  }
  if(data.error){
    list.innerHTML = `<div class="todo-empty">Couldn't load tasks: ${escapeHtml(data.error)}</div>`;
    return;
  }
  if(!data.todos || data.todos.length === 0){
    list.innerHTML = `<div class="todo-empty">Nothing on your list.</div>`;
    return;
  }
  list.innerHTML = data.todos.map(t => {
    const due = t.due ? new Date(t.due).toLocaleDateString(undefined,{ month:'short', day:'numeric' }) : '';
    return `<div class="todo-row">
      <span class="todo-check">☐</span>
      <span class="todo-name">${escapeHtml(t.title)}</span>
      ${due ? `<span class="todo-due">${due}</span>` : ''}
    </div>`;
  }).join('');
}

function renderAll(){
  renderWeekdayRow();
  renderMonthGrid();
  renderAgenda();
}

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.classList.toggle('error', !!isError);
}

async function loadSettings(){
  try{
    const res = await fetch('/api/settings');
    if(res.ok){
      SETTINGS = { ...SETTINGS, ...(await res.json()) };
      const r = document.documentElement.style;
      if(SETTINGS.weekStripHeight) r.setProperty('--week-strip-height', SETTINGS.weekStripHeight);
      const t = SETTINGS.theme || {};
      if(t.ink)       r.setProperty('--ink', t.ink);
      if(t.panel)     r.setProperty('--panel', t.panel);
      if(t.panelLine) r.setProperty('--panel-line', t.panelLine);
      if(t.text)      r.setProperty('--text', t.text);
      if(t.textDim)   r.setProperty('--text-dim', t.textDim);
      if(t.todayRing) r.setProperty('--today-ring', t.todayRing);
    }
  } catch(err){ /* keep defaults */ }
}

async function refreshData(){
  try{
    const res = await fetch('/api/events');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allEvents = (data.events || []).map(e => ({ ...e, start: parseEventDate(e.start, e.allDay), end: parseEventDate(e.end, e.allDay) }));
    renderAll();
    setStatus(data.errors && data.errors.length ? 'Some calendars failed: ' + data.errors.join(' | ') : '', data.errors && data.errors.length > 0);
  } catch(err){
    setStatus('Could not reach the calendar server: ' + err.message, true);
  }
}

async function refreshTodos(){
  if(!SETTINGS.todosEnabled) { renderTodos({ connected:false, todos:[] }); return; }
  try{
    const res = await fetch('/api/todos');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    renderTodos(await res.json());
  } catch(err){
    renderTodos({ connected:true, error: err.message, todos: [] });
  }
}

(async function init(){
  await loadSettings();
  setInterval(renderClock, 1000);
  renderClock();
  await refreshData();
  await refreshTodos();
  setInterval(refreshData, 60*1000); // poll the backend cache every minute; the server itself
                                       // only re-fetches upstream calendars every refreshMinutes
  setInterval(refreshTodos, 60*1000);
  setInterval(renderAll, 60*1000);

  // Chip heights depend on the webfonts and on the viewport, and the first
  // paint may measure fallback metrics — re-run the fit when either settles.
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(renderMonthGrid);
  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderMonthGrid, 150);
  });
})();
</script>

<style>
*{ box-sizing: border-box; }
html,body{ height:100%; margin:0; }
body{
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
}
#app{
  height: 100vh;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
#clock-wrap{ text-align: right; }
#clock{
  font-family: var(--font-mono);
  font-size: 45px;
  color: var(--text);
  line-height: 1.1;
}
#today-date{
  font-family: var(--font-display);
  font-size: 42px;
  color: var(--text);
  margin-top: 8px;
  line-height: 1.15;
}

#content{
  flex: 1;
  display: flex;
  gap: 24px;
  min-height: 0;
}

#month-grid-wrap{
  flex: 2.1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#weekday-row{
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--grid-gap);
  margin-bottom: 8px;
}
.weekday{
  text-align: center;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
#month-grid{
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--grid-gap);
  min-height: 0;
  overflow: hidden;
}
.day-cell{
  background: var(--panel);
  border-radius: var(--radius);
  padding: 8px 9px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
  min-height: 0;
}
/* Holds the chips for one day. min-height:0 lets it shrink inside the fixed
   cell, and the clipping here is the backstop for fitDayCell()'s measuring. */
.day-events{
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
}
/* Applied by fitDayCell() to days that would otherwise have to hide events. */
.day-events.compact{ gap: 3px; }
.day-events.compact .event-chip{ padding: 1px 5px; }
.day-events.compact .chip-title{
  -webkit-line-clamp: 1;
  line-clamp: 1;
  overflow-wrap: normal;
}
.day-cell.outside{ background: color-mix(in srgb, var(--panel) 35%, var(--ink)); }
.day-cell.outside .day-num{ color: var(--text-dim); }
.day-num{
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--text);
}
.day-cell.is-today .day-num{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--today-ring);
}
.event-chip{
  flex-shrink: 0;
  font-size: 11.5px;
  padding: 2px 6px;
  border-radius: 4px;
  display: flex;
  align-items: flex-start;
  gap: 5px;
  min-width: 0;
}
.chip-symbol{
  font-size: 15px;
  line-height: 1;
  flex-shrink: 0;
}
.chip-time{
  font-family: var(--font-mono);
  font-size: 10.5px;
  opacity: 0.85;
  margin-right: 2px;
}
.chip-title{
  min-width: 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.more-chip{
  flex-shrink: 0;
  font-size: 11px;
  line-height: 1.2;
  color: var(--text-dim);
  padding-left: 6px;
}

#side-col{
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}
#agenda-wrap{
  flex: 1.3;
  background: var(--panel);
  border-radius: var(--radius);
  padding: 20px 20px;
  overflow-y: auto;
  min-height: 0;
}
#todo-wrap{
  flex: 1;
  background: var(--panel);
  border-radius: var(--radius);
  padding: 20px 20px;
  overflow-y: auto;
  min-height: 0;
}
#agenda-header{
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
#agenda-title{ flex: 1; }
#clock-wrap{ margin-left: auto; }
#config-link{
  font-size: 18px;
  color: var(--text-dim);
  text-decoration: none;
  line-height: 1;
  margin-top: 4px;
}
#config-link:hover{ color: var(--text); }
#agenda-title, #todo-title{
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--text);
}
.agenda-row{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  margin-bottom: 5px;
  font-size: 18px;
  border-radius: 6px;
}
.agenda-symbol{
  width: 24px;
  text-align: center;
  flex-shrink: 0;
  font-size: 24px;
  line-height: 1;
}
.agenda-name{
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.agenda-when{
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  flex-shrink: 0;
  font-family: var(--font-mono);
  line-height: 1.2;
  opacity: 0.85;
}
.agenda-when-day{ font-size: 14px; }
.agenda-when-time{ font-size: 15px; }
.agenda-empty{
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.5;
}

.todo-row{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 14px;
  border-bottom: 1px solid var(--panel-line);
}
.todo-row:last-child{ border-bottom: none; }
.todo-check{
  color: var(--text-dim);
  flex-shrink: 0;
  font-size: 15px;
}
.todo-name{
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.todo-due{
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.todo-empty{
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.6;
}
.todo-mono{
  font-family: var(--font-mono);
  color: var(--today-ring);
}

#status{
  position: fixed;
  bottom: 10px;
  left: 32px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
#status.error{ color: #C97064; }
</style>

</body>
</html>
